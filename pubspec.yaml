name: seytron_vpn
description: SEYTRONS - Secure & Private Network VPN Application
publish_to: "none"
version: 2.4.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0
  flutter_svg: ^2.0.9

  # State Management
  provider: ^6.1.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Networking
  http: ^1.1.2
  dio: ^5.4.0

  # VPN & Permissions (Real Impl)
  permission_handler: ^11.3.1
  # wireguard_flutter_android: ^1.0.4  # Package not found on pub.dev; use openvpn_flutter later if needed
  network_info_plus: ^5.0.1
  device_info_plus: ^9.1.2

  # Utilities
  connectivity_plus: ^5.0.2
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.5
  share_plus: ^7.2.2
  clipboard: ^0.1.3

  # Charts & Graphs
  fl_chart: ^0.66.0

  # Animation
  lottie: ^3.0.0

  # Localization
  easy_localization: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/flags/
    - assets/fonts/
    - assets/translations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

